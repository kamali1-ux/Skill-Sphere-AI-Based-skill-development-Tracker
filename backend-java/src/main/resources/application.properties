spring.application.name=SkillSphere API
server.port=8080

# Database — set DB_URL, DB_USERNAME, DB_PASSWORD as environment variables in production
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillsphere_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT — set JWT_SECRET to a strong random value in production (64+ chars recommended)
app.jwt.secret=${JWT_SECRET:SkillSphereCollegeProjectSecretKeyChangeForProduction2026}
app.jwt.expiration-ms=86400000

# AI Service — set AI_SERVICE_URL if the Python service is deployed separately
app.ai-service.url=${AI_SERVICE_URL:http://localhost:5000}
