<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | SkillSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>
<body class="auth-page">
<div class="auth-card">
    <div class="d-flex align-items-center gap-2 mb-3"><span class="brand-mark">S</span><h1 class="h4 m-0">Login</h1></div>
    <form id="loginForm" class="vstack gap-3">
        <div><label class="form-label">Email</label><input class="form-control" type="email" id="email" required></div>
        <div><label class="form-label">Password</label><input class="form-control" type="password" id="password" required></div>
        <button class="btn btn-primary w-100">Login</button>
        <p class="text-center mb-0">New here? <a href="register.html">Create account</a></p>
    </form>
    <div id="message" class="mt-3 text-danger"></div>
</div>
<script src="../js/api.js?v=1.1"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    try {
        const result = await api("/auth/login", {
            method: "POST",
            auth: false,
            body: JSON.stringify({ email: emailInput.value, password: passwordInput.value })
        });
        localStorage.setItem("skillsphere_token", result.token);
        localStorage.setItem("skillsphere_user", JSON.stringify(result));
        location.href = "dashboard.html";
    } catch (error) {
        message.textContent = error.message;
    }
});
</script>
</body>
</html>
